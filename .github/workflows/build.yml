name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed only by the release step, which runs on tags
    permissions:
      contents: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: navi-player-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Tag pushes publish a release with the APK attached, so downloads do not
      # depend on Actions artifacts, which expire and need a login to fetch.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "navi-player-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" \
            "navi-player-${GITHUB_REF_NAME}.apk" \
            --title "Navi player ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
