name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release at this tag, e.g. v3.0. Leave empty to only build.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed only by the release step, which runs on tags
    permissions:
      contents: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: navi-player-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A release carries the APK itself, so downloading it needs no login and
      # does not expire the way an Actions artifact does. Either push a version
      # tag, or run this workflow by hand and name the tag — in the second case
      # the release creates the tag at the commit that was just built.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "navi-player-${TAG}.apk"
          gh release create "${TAG}" \
            "navi-player-${TAG}.apk" \
            --target "${GITHUB_SHA}" \
            --title "Navi player ${TAG}" \
            --notes-file RELEASE_NOTES.md
