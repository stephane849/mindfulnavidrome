plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.stephane.naviplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.stephane.naviplayer"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // MediaBrowserServiceCompat, MediaSessionCompat, MediaStyle notification,
    // MediaButtonReceiver and the audio-focus compat helpers all live here.
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.core:core-ktx:1.12.0'
}
