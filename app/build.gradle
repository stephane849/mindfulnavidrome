plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.stephane.naviplayer'
    // 35 is required by activity-compose 1.10.1, which MMD pulls in. targetSdk
    // stays at 34 on purpose: targeting 35 opts into Android 15 edge-to-edge
    // enforcement, which is a behaviour change and not part of a design pass.
    compileSdk 35

    defaultConfig {
        applicationId "com.stephane.naviplayer"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // TopAppBarMMD and TextFieldMMD expose experimental Material 3 types.
        // Media3's @UnstableApi needs no counterpart here: it is a plain Java
        // annotation, not a Kotlin opt-in marker, so kotlinc does not gate on it.
        freeCompilerArgs += ['-opt-in=androidx.compose.material3.ExperimentalMaterial3Api']
    }
}

dependencies {
    // Media3 replaces MediaPlayer and MediaBrowserServiceCompat entirely. It
    // brings constant-bitrate MP3 seeking (headerless class recordings seek
    // accurately), audio focus, becoming-noisy and the media notification.
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-datasource:1.5.1'

    implementation 'androidx.core:core-ktx:1.13.1'

    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'

    // Mudita Mindful Design: E-Ink colour scheme, Lato typography, ripple-free
    // components and the stepped-scrolling list. Apache-2.0, on Maven Central.
    implementation 'com.mudita:MMD:1.0.2'
}
