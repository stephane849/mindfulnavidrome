plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.stephane.naviplayer'
    // 35 is required by activity-compose 1.10.1, which MMD pulls in. targetSdk
    // stays at 34 on purpose: targeting 35 opts into Android 15 edge-to-edge
    // enforcement, which is a behaviour change and not part of a design pass.
    compileSdk 35

    defaultConfig {
        applicationId "com.stephane.naviplayer"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "4.2"
    }

    buildFeatures {
        compose true
        // Off by default in AGP 8; the crash report names the version it came
        // from, which matters when the APK is sideloaded from a release
        buildConfig true
    }

    // A fixed debug key, committed on purpose. Without it every CI run
    // generates its own throwaway keystore, so each APK is signed differently
    // and refuses to install over the last one - which meant uninstalling, and
    // losing saved credentials, resume positions and the queue, on every build.
    // This is a debug key only and grants nothing: it never signs a release.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // TopAppBarMMD and TextFieldMMD expose experimental Material 3 types.
        // Media3's @UnstableApi needs no counterpart here: it is a plain Java
        // annotation, not a Kotlin opt-in marker, so kotlinc does not gate on it.
        freeCompilerArgs += [
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
            // combinedClickable, for long-press queue actions
            '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi',
        ]
    }
}

dependencies {
    // Media3 replaces MediaPlayer and MediaBrowserServiceCompat entirely. It
    // brings constant-bitrate MP3 seeking (headerless class recordings seek
    // accurately), audio focus, becoming-noisy and the media notification.
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-datasource:1.5.1'

    implementation 'androidx.core:core-ktx:1.13.1'

    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'

    // Mudita Mindful Design: E-Ink colour scheme, Lato typography, ripple-free
    // components and the stepped-scrolling list. Apache-2.0, on Maven Central.
    implementation 'com.mudita:MMD:1.0.2'
}
